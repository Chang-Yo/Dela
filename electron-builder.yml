appId: io.dela.desktop
productName: Dela
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
icon: assets/Dela_white_bg.png
asar: true
directories:
  output: dist
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - assets/Dela_white_bg.png
  - assets/Dela_black_bg.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  # web_fetch 的 PDF.js Node 兼容层使用原生 canvas；覆盖主包与平台二进制包
  - node_modules/@napi-rs/canvas*/**/*
  # 引导开场的可选视频；文件不存在时该行无副作用
  - out/renderer/assets/*.mp4
# 自带 OpenSSH 客户端：系统没装时远程项目的回退（主进程按 resources/openssh 探测）
extraResources:
  - from: vendor/openssh
    to: openssh
    filter:
      - 'ssh.exe'
      - 'libcrypto.dll'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - 'README.md'
  # 远端 helper 的静态二进制：Dela 上传到远端后经 ssh -L 隧道访问（主进程按 resources/dela-helper 探测）
  - from: vendor/dela-helper
    to: dela-helper
    filter:
      - 'dela-helper-*'
  # 随包 MinGit 运行时：scripts/prepare-runtime.mjs 在打包前下载并校验（主进程按 resources/mingit 探测），
  # 让没装 Git for Windows 的机器开箱即用
  - from: .build/mingit
    to: mingit
  # 随包搜索工具：内核 grep/find spawn 的 rg 与 fd（主进程启动时把 resources/bin 前插 PATH）
  - from: vendor/bin
    to: bin
npmRebuild: false
# Windows-only，NSIS 安装包与 electron-updater 更新元数据。
publish:
  provider: generic
  url: https://openlist.frameneo.com/sd/Dela_latest_release/
  channel: latest
  useMultipleRangeRequest: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
