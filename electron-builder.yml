appId: io.dela.desktop
productName: Dela
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
icon: assets/Dela_white_bg.png
asar: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - assets/Dela_white_bg.png
  - assets/Dela_black_bg.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  # pdfjs 主进程渲染页图像所需的原生 canvas；覆盖主包与平台二进制包
  - node_modules/@napi-rs/canvas*/**/*
  # 引导开场的可选视频；文件不存在时该行无副作用
  - out/renderer/assets/*.mp4
# 自带 OpenSSH 客户端：系统没装时远程项目的回退（主进程按 resources/openssh 探测）
extraResources:
  - from: vendor/openssh
    to: openssh
    filter:
      - 'ssh.exe'
      - 'libcrypto.dll'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - 'README.md'
  # 远端 helper 的静态二进制：Dela 上传到远端后经 ssh -L 隧道访问（主进程按 resources/dela-helper 探测）
  - from: vendor/dela-helper
    to: dela-helper
    filter:
      - 'dela-helper-*'
npmRebuild: false
# Windows-only。安装包暂用 NSIS（exe）；MSIX 与微软商店上架是后续计划。
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
