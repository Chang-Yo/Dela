appId: io.dela.desktop
productName: Dela
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
asar: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  minimumSystemVersion: '13.0'
  target: dmg
linux:
  target: AppImage
