appId: io.dela.desktop
productName: Dela
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
icon: assets/Dela_white_bg.png
asar: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - assets/Dela_white_bg.png
  - assets/Dela_black_bg.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  # pdfjs 主进程渲染页图像所需的原生 canvas；覆盖主包与平台二进制包
  - node_modules/@napi-rs/canvas*/**/*
  # 引导开场的可选视频；文件不存在时该行无副作用
  - out/renderer/assets/*.mp4
  # 商店更新模块：原生 .node 必须落在 asar 外，Electron 才能 dlopen
  - out/native/*.node
# 自带 OpenSSH 客户端：系统没装时远程项目的回退（主进程按 resources/openssh 探测）
extraResources:
  - from: vendor/openssh
    to: openssh
    filter:
      - 'ssh.exe'
      - 'libcrypto.dll'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - 'README.md'
  # 远端 helper 的静态二进制：Dela 上传到远端后经 ssh -L 隧道访问（主进程按 resources/dela-helper 探测）
  - from: vendor/dela-helper
    to: dela-helper
    filter:
      - 'dela-helper-*'
npmRebuild: false
# Windows-only。自建分发用 NSIS（exe）；商店提交包由下面的 appx 目标单独构建（见 docs/DEVELOPMENT.md §17）。
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# 微软商店提交包：electron-builder 的 appx 目标，产物扩展名是 .appx。
# 下面三项取自 Partner Center「应用概览 → 产品管理 → View app identity details」，是 Dela
# 的真实产品标识（Package/Identity/Name、Package/Identity/Publisher、PublisherDisplayName）。
# 三者必须逐字一致：大小写、空格、标点都算，在 Partner Center 改名后要同步这里，否则商店按
# 身份不匹配拒收。applicationId 是自己取的清单内标识；包内图标见 build/appx/（docs/DEVELOPMENT.md §17）。
# 不需要仓库自带证书：未配置证书时构建出的是未签名包，签名由商店在收包后完成。
appx:
  identityName: MADFilm.Dela
  publisher: 'CN=57320C20-35BA-45E0-8AB9-95D7D30D80AC'
  publisherDisplayName: 麦德映画 (MAD Film)
  applicationId: Dela
  languages: ['zh-CN']
  # 不配置时 electron-builder 写死 #464646（AppXOptions 的默认值），这个灰不属于 Dela：
  # 它会出现在开始磁贴的透明四角，以及商店「应用说明」页。取图标自带的板色 #0A0A0A，
  # 让磁贴与图标连成一片；build/appx 的宽图是透明底，不再把颜色烤进图片。
  backgroundColor: '#0A0A0A'
  # 不配置时 electron-builder 写死 10.0.14316.0（Win10 1511），低于应用内更新所需基线：
  # StoreContext 的更新 API 要 1607(14393)，静默下载与下载进度回调要 1803(17134)。
  # 这里与 ChatGPT 桌面版取齐：Win10 2004 起可安装。
  minVersion: '10.0.19041.0'
  # 仅声明「已测试过的上限」，不限制安装。
  maxVersionTested: '10.0.26100.0'
