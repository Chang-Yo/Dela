appId: io.dela.desktop
productName: Dela
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
icon: assets/Dela_white_bg.png
asar: true
directories:
  output: dist
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - assets/Dela_white_bg.png
  - assets/Dela_black_bg.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  # 引导开场的可选视频；文件不存在时该行无副作用
  - out/renderer/assets/*.mp4
extraResources:
  # 远端 helper 的静态二进制：Dela 上传到远端后经 ssh -L 隧道访问（主进程按 resources/dela-helper 探测）
  - from: vendor/dela-helper
    to: dela-helper
    filter:
      - 'dela-helper-*'
  # 两端共用搜索工具的来源与许可证；可执行文件按平台选择。
  - from: vendor/bin
    to: bin
    filter:
      - 'LICENSE-*.txt'
      - 'README.md'
npmRebuild: false
win:
  publish:
    provider: generic
    url: https://openlist.frameneo.com/sd/Dela_latest_release/
    channel: latest
    useMultipleRangeRequest: false
  extraResources:
    - from: vendor/openssh
      to: openssh
      filter:
        - 'ssh.exe'
        - 'libcrypto.dll'
        - 'LICENSE.txt'
        - 'NOTICE.txt'
        - 'README.md'
    - from: .build/mingit
      to: mingit
    - from: vendor/bin
      to: bin
      filter:
        - '*.exe'
  target:
    - target: nsis
      arch:
        - x64
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # 开发验证产物，尚未配置 Mac 更新源；不生成面向现有 Windows CDN 的元数据。
  publish: null
  extraResources:
    - from: 'vendor/bin/darwin-${arch}'
      to: 'bin/darwin-${arch}'
      filter:
        - 'rg'
        - 'fd'
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
