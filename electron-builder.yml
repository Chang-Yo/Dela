appId: io.dela.desktop
productName: Dela
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
icon: assets/Dela_white_bg.png
asar: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - assets/Dela_white_bg.png
  - assets/Dela_black_bg.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
  # pdfjs 主进程渲染页图像所需的原生 canvas；覆盖主包与平台二进制包
  - node_modules/@napi-rs/canvas*/**/*
  # 引导开场的可选视频；文件不存在时该行无副作用
  - out/renderer/assets/*.mp4
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  minimumSystemVersion: '13.0'
  target: dmg
linux:
  target: AppImage
