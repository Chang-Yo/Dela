# pnpm 12 project settings only; no child packages or monorepo.
saveExact: true
engineStrict: true
strictPeerDependencies: true
allowBuilds:
  # pi-agent-core 传递依赖：仅用 OpenAI 兼容路径，不触发这些包的安装脚本；
  # esbuild 二进制来自 @esbuild/win32-x64 optional 依赖，protobufjs/@google/genai 的
  # postinstall 只做生成物校验，均可安全跳过。
  '@google/genai': false
  better-sqlite3: false
  node-pty: true
  electron-winstaller: false
  esbuild: false
  protobufjs: false
minimumReleaseAgeExclude:
  - electron@44.9.3
  - lucide-react@1.44.0
  - '@earendil-works/pi-mcp@0.99.0 || 1.1.0'
  - '@earendil-works/chord@1.1.0'
  - '@earendil-works/pi-agent-core@1.1.0'
  - '@earendil-works/pi-ai@1.1.0'
  - '@earendil-works/pi-codemode@1.1.0'
  - '@earendil-works/pi-coding-agent@1.1.0'
  - '@earendil-works/pi-telemetry@1.1.0'
  - '@earendil-works/pi-tui@1.1.0'
  - '@mdream/js@2.0.1'
  - file-type@22.2.0
