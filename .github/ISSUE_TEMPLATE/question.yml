name: 想法与可行性讨论
description: 提交还不确定是否适合或能否实现的功能想法
title: '[Question] '
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        这里用于讨论还不确定是否适合 Dela，或者能否实现的想法。
        你不需要提供技术方案；如果需求已经明确，请改用“功能建议”模板。
  - type: textarea
    id: idea
    attributes:
      label: 功能想法
      description: 大概希望 Dela 提供什么能力？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期效果
      description: 这项能力希望改善什么体验，或帮助解决什么问题？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充说明（可选）
      description: 可以补充使用场景、类似产品或相关链接。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同想法。
          required: true
