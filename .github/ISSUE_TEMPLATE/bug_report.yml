name: 错误报告
description: 报告可以复现的 Dela 使用问题
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Dela。请勿上传 API Key、Token、Cookie、邮件内容、课程资料或其他个人信息。
        提交前请先搜索现有 Issue，并确认问题来自 Dela 本身。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？请尽量简洁、具体。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dela 版本
      description: 可以在“设置 › 关于”查看；不知道时填写“未知”。
      placeholder: 例如：1.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 请填写系统名称和版本。
      placeholder: 例如：Windows 11 24H2 / macOS 15.7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开 Dela 开始，怎样可以再次看到这个问题？
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 正常情况下，你认为应该发生什么？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 日志、截图或其他信息（可选）
      description: 可以附上已经脱敏的日志、截图或相关说明。请勿上传任何凭据和个人数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我已删除 API Key、Token、Cookie 和其他个人信息。
          required: true
