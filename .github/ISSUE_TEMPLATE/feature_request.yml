name: 功能建议
description: 提交希望 Dela 新增或改进的功能
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Dela。提交前请先搜索现有 Issue，避免重复建议。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么时候遇到了什么问题？
      placeholder: 例如：在用 canvas 下载课程资料的时候，无法批量下载和管理，预览也很麻烦。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 希望 Dela 做到什么？描述结果即可，不需要设计技术方案。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样算解决
      description: 做到什么程度时，你会认为这个问题已经解决？若你作为测试会如何验收这个功能？
      placeholder: 建议写成一至三条可以看到或实际检查的结果。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 复杂需求补充（可选）
      description: 可以补充正常怎么使用、失败时怎么办、关键规则，以及本次明确不做什么。不确定可以留空。
  - type: textarea
    id: alternatives
    attributes:
      label: 方案想法或替代方式（可选）
      description: 如果你想到过实现方式、临时替代方案或相似产品，可以写在这里。
  - type: textarea
    id: context
    attributes:
      label: 补充材料（可选）
      description: 可以附截图、链接、数据样本或其他参考资料。请先删除个人信息和敏感数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
