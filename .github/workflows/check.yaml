name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      helper: ${{ steps.filter.outputs.helper == 'true' || steps.filter.outputs.common == 'true' }}
      windows: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' || steps.filter.outputs.windows == 'true' }}
      macos: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' || steps.filter.outputs.macos == 'true' }}
      archives: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.archives == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - '!{docs/**,.agents/**,.claude/**,*.md,skills-lock.json}'
            common:
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'electron-builder.*'
              - 'vite*.config.*'
              - 'vitest*.config.*'
              - 'tsconfig*.json'
              - 'build/**'
              - 'assets/**'
            helper:
              - 'helper/**'
              - 'scripts/build-helper.ts'
              - 'vendor/dela-helper/**'
            runtime:
              - 'helper/**'
              - 'vendor/dela-helper/**'
              - 'scripts/**'
              - 'src/main/*'
              - 'src/main/terminal/**'
              - 'src/main/remotes/**'
              - 'src/main/documents/**'
              - 'src/main/update/**'
              - 'src/preload/**'
              - 'src/shared/**'
              - 'vendor/bin/*'
            windows:
              - 'vendor/openssh/**'
            macos:
              - 'vendor/bin/darwin-*/**'
            archives:
              - 'scripts/verify-macos-package.ts'

  basic:
    name: Basic checks
    needs: changes
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DELA_REMOTE_HOST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.3.4
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install formatting dependencies without build scripts
        if: needs.changes.outputs.code != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: pnpm format:check
      - name: Lint, typecheck, build and test
        if: needs.changes.outputs.code == 'true'
        run: |
          pnpm lint
          pnpm build
          pnpm test
      - uses: actions/upload-artifact@v6
        if: needs.changes.outputs.windows == 'true'
        with:
          name: windows-build
          path: out/
          if-no-files-found: error
          retention-days: 1

  helper:
    needs: [changes, basic]
    if: needs.changes.outputs.helper == 'true'
    name: Check helper linux (amd64 + arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Vet helper for linux/arm64
        working-directory: helper
        env:
          GOOS: linux
          GOARCH: arm64
        run: go vet ./...
      - name: Test helper locally (no SSH)
        working-directory: helper
        run: go test -count=1 -timeout=2m ./...
      - name: Build helper
        run: node scripts/build-helper.ts --all
      - name: Smoke test helper executables
        run: |
          ./vendor/dela-helper/dela-helper-linux-amd64 --version
          command -v qemu-aarch64-static >/dev/null 2>&1 || sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static ./vendor/dela-helper/dela-helper-linux-arm64 --version
      - uses: actions/upload-artifact@v6
        with:
          name: helper-linux-amd64
          path: vendor/dela-helper/dela-helper-linux-amd64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: helper-linux-arm64
          path: vendor/dela-helper/dela-helper-linux-arm64
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [changes, basic, helper]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.basic.result == 'success' &&
          needs.changes.outputs.windows == 'true' &&
          (needs.helper.result == 'success' ||
           (needs.changes.outputs.helper == 'false' && needs.helper.result == 'skipped')) }}
    name: Check win-x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DELA_REMOTE_HOST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.helper == 'true'
        with:
          name: helper-linux-amd64
          path: vendor/dela-helper
      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.helper == 'true'
        with:
          name: helper-linux-arm64
          path: vendor/dela-helper
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.3.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: windows-build
          path: out
      - name: Smoke test Electron
        run: pnpm smoke
      - name: Package application directory
        if: needs.changes.outputs.archives != 'true'
        run: |
          pnpm prepare:runtime
          pnpm exec electron-builder --dir --win --x64 --publish never
      - name: Build Windows installer
        if: needs.changes.outputs.archives == 'true'
        run: |
          pnpm prepare:runtime
          pnpm exec electron-builder --win --x64 --publish never
      - name: Verify packaged helper
        run: |
          cmp vendor/dela-helper/dela-helper-linux-amd64 dist/win-unpacked/resources/dela-helper/dela-helper-linux-amd64
          cmp vendor/dela-helper/dela-helper-linux-arm64 dist/win-unpacked/resources/dela-helper/dela-helper-linux-arm64
      - name: Smoke test packaged app
        env:
          PACKAGED_EXECUTABLE: dist/win-unpacked/Dela.exe
        run: '"$PACKAGED_EXECUTABLE" --smoke-test'

  macos:
    needs: [changes, basic, helper]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.basic.result == 'success' &&
          needs.changes.outputs.macos == 'true' &&
          (needs.helper.result == 'success' ||
           (needs.changes.outputs.helper == 'false' && needs.helper.result == 'skipped')) }}
    name: Check mac-arm64
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DELA_REMOTE_HOST: ''
      PACKAGED_APP: dist/mac-arm64/Dela.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.helper == 'true'
        with:
          name: helper-linux-amd64
          path: vendor/dela-helper
      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.helper == 'true'
        with:
          name: helper-linux-arm64
          path: vendor/dela-helper
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: arm64
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - name: Install pnpm
        run: npm install --global pnpm@12.3.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: |
          pnpm build
          pnpm test
      - name: Smoke test Electron and runtime
        run: |
          pnpm smoke
          pnpm smoke:macos
          pnpm smoke:runtime
          pnpm smoke:desktop
          pnpm exec electron scripts/terminal-smoke.cjs
      - name: Package application directory
        if: needs.changes.outputs.archives != 'true'
        run: pnpm exec electron-builder --dir --mac --arm64 --publish never -c.electronDist=node_modules/electron/dist
      - name: Build development DMG and ZIP
        if: needs.changes.outputs.archives == 'true'
        run: pnpm exec electron-builder --mac --arm64 --publish never -c.electronDist=node_modules/electron/dist
      - name: Verify package resources
        if: needs.changes.outputs.archives != 'true'
        run: node scripts/verify-macos-package.ts "$PACKAGED_APP" --dir
      - name: Verify package resources and archives
        if: needs.changes.outputs.archives == 'true'
        run: node scripts/verify-macos-package.ts "$PACKAGED_APP"
      - name: Smoke test LaunchServices startup
        run: node scripts/macos-launch-smoke.ts "$PACKAGED_APP"
      - name: Smoke test packaged app and native dependencies
        run: |
          "$PACKAGED_APP/Contents/MacOS/Dela" --smoke-test
          pnpm smoke:macos "$PACKAGED_APP/Contents/Resources/app.asar"
          pnpm smoke:desktop "$PACKAGED_APP/Contents/Resources/app.asar"
          pnpm exec electron scripts/terminal-smoke.cjs "$PACKAGED_APP/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@v6
        if: needs.changes.outputs.archives == 'true'
        with:
          name: development-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [changes, basic, helper, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          for (const name of ['changes', 'basic']) {
            if (needs[name].result !== 'success') {
              throw new Error(name + ': ' + needs[name].result);
            }
          }
          for (const name of ['helper', 'windows', 'macos']) {
            const selected = needs.changes.outputs[name];
            if (!['true', 'false'].includes(selected)) throw new Error('Missing selection: ' + name);
            const expected = selected === 'true' ? 'success' : 'skipped';
            if (needs[name].result !== expected) {
              throw new Error(name + ': expected ' + expected + ', got ' + needs[name].result);
            }
          }
          NODE
