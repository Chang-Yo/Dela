name: Release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example, v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (tag !== `v${version}` || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error('Tag must be v<package.json version>, optionally with a prerelease suffix');
          }
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nsha=${sha}\n`);
          NODE

  helper:
    needs: prepare
    name: Build helper linux (amd64 + arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Vet helper for linux/arm64
        working-directory: helper
        env:
          GOOS: linux
          GOARCH: arm64
        run: go vet ./...
      - name: Test helper locally (no SSH)
        working-directory: helper
        run: go test -count=1 -timeout=2m ./...
      - name: Build helper
        run: node scripts/build-helper.mjs --all
      - name: Smoke test helper executables
        run: |
          ./vendor/dela-helper/dela-helper-linux-amd64 --version
          command -v qemu-aarch64-static >/dev/null 2>&1 || sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static ./vendor/dela-helper/dela-helper-linux-arm64 --version
      - uses: actions/upload-artifact@v6
        with:
          name: helper-linux-amd64
          path: vendor/dela-helper/dela-helper-linux-amd64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: helper-linux-arm64
          path: vendor/dela-helper/dela-helper-linux-arm64
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [prepare, helper]
    name: Build win-x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DELA_REMOTE_HOST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: helper-linux-amd64
          path: vendor/dela-helper
      - uses: actions/download-artifact@v6
        with:
          name: helper-linux-arm64
          path: vendor/dela-helper
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.3.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: |
          pnpm build
          pnpm test
      - name: Smoke test Electron
        run: pnpm smoke
      - name: Prepare bundled runtime
        run: node scripts/prepare-runtime.mjs
      - name: Build installer
        run: pnpm exec electron-builder --win --x64 --publish never
      - name: Verify update artifacts
        run: |
          test -f dist/win-unpacked/resources/app-update.yml
          test -f "dist/Dela-${RELEASE_TAG#v}-win-x64.exe"
          test -f "dist/Dela-${RELEASE_TAG#v}-win-x64.exe.blockmap"
          if [[ "$RELEASE_TAG" != *-* ]]; then test -f dist/latest.yml; fi
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - name: Verify packaged helper
        run: |
          cmp vendor/dela-helper/dela-helper-linux-amd64 dist/win-unpacked/resources/dela-helper/dela-helper-linux-amd64
          cmp vendor/dela-helper/dela-helper-linux-arm64 dist/win-unpacked/resources/dela-helper/dela-helper-linux-arm64
      - name: Smoke test packaged app
        env:
          PACKAGED_EXECUTABLE: dist/win-unpacked/Dela.exe
        run: '"$PACKAGED_EXECUTABLE" --smoke-test'
      - uses: actions/upload-artifact@v6
        with:
          name: installer-win-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Create and publish release
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          {
            echo '## 提交记录'
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --format='- %s (`%h`)' "${previous_tag}..${RELEASE_TAG}"
            else
              git log --no-merges --format='- %s (`%h`)' "$RELEASE_TAG"
            fi
          } > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* \
              --verify-tag --draft --generate-notes --notes-file release-notes.md --title "$RELEASE_TAG" "${prerelease[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-public:
    needs: [prepare, release]
    name: Publish to public releases repo
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      GH_REPO: Chang-Yo/Dela_releases
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: release-notes
          path: .
      - name: Publish installers and release notes
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::PUBLIC_RELEASE_TOKEN secret is not configured (fine-grained PAT with Contents write on Chang-Yo/Dela_releases)'
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* \
              --draft --notes-file release-notes.md --title "$RELEASE_TAG" "${prerelease[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
